<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="contenedor estrecho">
    <h1>Categorías</h1>

    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.codigo}">1</td>
            <td th:text="${c.nombre}">Nombre</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
